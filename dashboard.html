<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isaac · Cognitive Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Theme tokens — switch via data-theme on <html> */
:root, html[data-theme="plasma"]{
  --bg-0:#0b0d10;--bg-1:#12161c;--bg-2:#181e27;--bg-3:#1f2633;
  --line:#273140;--line-hot:#3a465c;--text:#e9eef5;--muted:#9aabc0;--dim:#6b7a90;
  --rot:#ff5c5c;--blau:#5b9dff;--gruen:#3dd68c;
  --owner:#ffb020;--isaac:#40e0ff;--warn:#ffc14d;--danger:#ff5c7a;--info:#6bb0ff;
  --isaac-soft:rgba(64,224,255,.14);--owner-soft:rgba(255,176,32,.14);
  --radius:14px;--radius-sm:10px;
  --font:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --shadow:0 12px 40px rgba(0,0,0,.45);
}
html[data-theme="violet"]{
  --bg-0:#0c0a10;--bg-1:#14111c;--bg-2:#1c1828;--bg-3:#252035;
  --line:#342f48;--line-hot:#4a4266;--text:#f0ecf8;--muted:#a89bb8;--dim:#7a6f90;
  --rot:#f87171;--blau:#60a5fa;--gruen:#34d399;
  --owner:#f0abfc;--isaac:#a78bfa;--warn:#fbbf24;--danger:#fb7185;--info:#818cf8;
  --isaac-soft:rgba(167,139,250,.16);--owner-soft:rgba(240,171,252,.14);
}
html[data-theme="ember"]{
  --bg-0:#100e0c;--bg-1:#1a1612;--bg-2:#241f18;--bg-3:#2e271e;
  --line:#3d3428;--line-hot:#564836;--text:#f5efe6;--muted:#b5a894;--dim:#857864;
  --rot:#e85d4c;--blau:#6ba3d6;--gruen:#6bcf8e;
  --owner:#f5d08a;--isaac:#e8a45a;--warn:#f0c14d;--danger:#e85d6a;--info:#8ab4d9;
  --isaac-soft:rgba(232,164,90,.16);--owner-soft:rgba(245,208,138,.14);
}
html[data-theme="contrast"]{
  --bg-0:#0a0b0e;--bg-1:#12141a;--bg-2:#1a1d26;--bg-3:#222632;
  --line:#2e3444;--line-hot:#3d465c;--text:#f2f4f8;--muted:#a8b0c0;--dim:#7a8499;
  --rot:#e85d4c;--blau:#4c8dde;--gruen:#3ecf8e;
  --owner:#f0b429;--isaac:#3ee0cc;--warn:#e6b84d;--danger:#e85d6a;--info:#6b9fff;
  --isaac-soft:rgba(62,224,204,.14);--owner-soft:rgba(240,180,41,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body.dash{
  height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  font-family:var(--font);color:var(--text);
  background:
    radial-gradient(ellipse 80% 50% at 10% -10%,var(--isaac-soft),transparent 50%),
    radial-gradient(ellipse 60% 40% at 100% 0%,var(--owner-soft),transparent 45%),
    var(--bg-0);
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,textarea,select{
  background:var(--bg-0);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:.55rem .7rem;color:var(--text);
}
input:focus,textarea:focus{outline:1px solid var(--isaac);border-color:var(--isaac)}
.scroll-y{min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.min0{min-height:0;min-width:0}
.shell{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px;gap:10px}
/* Header */
.header{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(180deg,var(--bg-2),var(--bg-1));box-shadow:var(--shadow);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:.95rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--isaac)}
.brand small{display:block;color:var(--muted);font-size:.75rem;font-weight:400;letter-spacing:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dim);flex-shrink:0}
.dot.on{background:var(--gruen);box-shadow:0 0 12px color-mix(in srgb, var(--gruen) 55%, transparent)}
.dot.boot{background:var(--warn);animation:pulse 1.2s infinite}
.dot.err{background:var(--danger);animation:pulse .7s infinite}
@keyframes pulse{50%{opacity:.5}}
.mode-tog{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.mode-tog button{padding:.4rem .75rem;font-size:.78rem;color:var(--muted)}
.mode-tog button.active{background:var(--isaac-soft);color:var(--isaac)}
.h-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:.28rem .55rem;border-radius:999px;
  border:1px solid var(--line);font-size:.72rem;color:var(--muted);background:rgba(0,0,0,.25)
}
.chip.hot{border-color:color-mix(in srgb, var(--isaac) 45%, transparent);color:var(--isaac)}
.chip.warn{border-color:rgba(230,184,77,.4);color:var(--warn)}
.btn{
  padding:.45rem .75rem;border-radius:var(--radius-sm);border:1px solid var(--line-hot);
  background:var(--bg-2);font-size:.8rem;transition:.15s
}
.btn:hover{border-color:var(--isaac);color:var(--isaac)}
.btn.danger{border-color:rgba(232,93,106,.45);color:var(--danger)}
.btn.primary{background:var(--isaac-soft);border-color:color-mix(in srgb, var(--isaac) 45%, transparent);color:var(--isaac)}
.clock{font-family:var(--mono);font-size:.75rem;color:var(--dim)}

.theme-tog{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;max-width:100%;flex-wrap:wrap}
.theme-tog button{padding:.35rem .55rem;font-size:.68rem;color:var(--muted);text-transform:capitalize}
.theme-tog button.active{background:var(--isaac-soft);color:var(--isaac)}

/* NOW */
.now{
  flex:0 0 auto;border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(135deg,color-mix(in srgb, var(--bg-2) 95%, transparent),color-mix(in srgb, var(--bg-1) 98%, transparent));
  padding:12px 14px;box-shadow:var(--shadow)
}
.now-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.now-head{font-size:.95rem;font-weight:600;color:var(--text);line-height:1.35}
.now-sub{font-size:.78rem;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.now-phases{display:flex;align-items:center;gap:0;overflow-x:auto;padding-bottom:4px}
.phase{
  flex:1;min-width:72px;text-align:center;position:relative;padding:6px 4px
}
.phase::after{
  content:"";position:absolute;top:14px;left:50%;width:100%;height:2px;background:var(--line);z-index:0
}
.phase:last-child::after{display:none}
.phase-node{
  width:14px;height:14px;border-radius:50%;margin:0 auto 6px;position:relative;z-index:1;
  background:var(--dim);border:2px solid var(--bg-1)
}
.phase.done .phase-node{background:var(--gruen)}
.phase.active .phase-node{background:var(--isaac);box-shadow:0 0 14px color-mix(in srgb, var(--isaac) 70%, transparent);animation:pulse 1.8s infinite}
.phase.blocked .phase-node{background:var(--danger)}
.phase-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.phase.active .phase-label{color:var(--isaac)}
.phase.layer-rot .phase-node{border-color:rgba(232,93,76,.5)}
.phase.layer-blau .phase-node{border-color:rgba(76,141,222,.5)}
.phase.layer-gruen .phase-node{border-color:rgba(62,207,142,.5)}
/* Body */
.body{flex:1;min-height:0;display:grid;grid-template-columns:72px minmax(0,1fr) minmax(300px,380px);gap:10px}
body.focus .body{grid-template-columns:0 minmax(0,.4fr) minmax(0,1fr)}
body.focus .nav{display:none}
body.focus .stage-wrap{display:none}
body.focus .kpi-focus{display:grid}
.kpi-focus{display:none;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:8px}
/* Nav */
.nav{
  min-height:0;display:flex;flex-direction:column;gap:4px;padding:8px 6px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-1);overflow-y:auto
}
.nav button{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;
  border-radius:var(--radius-sm);color:var(--muted);font-size:.62rem;letter-spacing:.02em
}
.nav button:hover,.nav button.active{background:var(--isaac-soft);color:var(--isaac)}
.nav button .ico{font-size:1.05rem;line-height:1}
/* Stage */
.stage-wrap{
  min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--bg-1);box-shadow:var(--shadow);overflow:hidden
}
.stage-bar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--line)
}
.stage-bar h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.stage{flex:1;min-height:0;overflow-y:auto;padding:14px;overscroll-behavior:contain}
/* Chat */
.chat-wrap{
  min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--bg-1);box-shadow:var(--shadow);overflow:hidden
}
.chat-bar{flex:0 0 auto;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.chat-bar h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.msg{max-width:95%;padding:10px 12px;border-radius:12px;font-size:.88rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.steffen{align-self:flex-end;background:var(--owner-soft);border:1px solid color-mix(in srgb, var(--owner) 40%, transparent)}
.msg.isaac{align-self:flex-start;background:var(--isaac-soft);border:1px solid color-mix(in srgb, var(--isaac) 35%, transparent)}
.msg.sys{align-self:center;background:transparent;color:var(--dim);font-size:.75rem;border:none;padding:4px}
.msg .who{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:4px;font-family:var(--mono)}
.composer{flex:0 0 auto;padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.composer textarea{min-height:72px;resize:vertical;max-height:160px;width:100%}
.composer-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{font-size:.68rem;padding:.25rem .5rem;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.quick button:hover{border-color:var(--owner);color:var(--owner)}
/* Panels shared */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.kpi{
  padding:12px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--bg-0)
}
.kpi .k{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:6px}
.kpi .v{font-size:1.25rem;font-weight:700;font-family:var(--mono)}
.kpi .v.g{color:var(--gruen)}.kpi .v.y{color:var(--warn)}.kpi .v.r{color:var(--danger)}.kpi .v.c{color:var(--isaac)}.kpi .v.o{color:var(--owner)}
.card{
  padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);
  background:var(--bg-0);margin-bottom:10px
}
.card h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.metric{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid rgba(46,52,68,.5);font-size:.84rem}
.metric:last-child{border-bottom:none}
.metric span:first-child{color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filters button{
  padding:.35rem .65rem;border-radius:999px;border:1px solid var(--line);font-size:.75rem;color:var(--muted)
}
.filters button.active{border-color:var(--isaac);color:var(--isaac);background:var(--isaac-soft)}
/* Tasks */
.task{
  border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg-0);
  margin-bottom:10px;overflow:hidden
}
.task.running{border-left:3px solid var(--warn)}
.task.done{border-left:3px solid var(--gruen)}
.task.failed{border-left:3px solid var(--danger)}
.task.evaluating,.task.followup{border-left:3px solid var(--blau)}
.task-h{
  display:grid;grid-template-columns:64px 72px 1fr 70px 48px 48px;gap:8px;align-items:center;
  padding:10px 12px;cursor:pointer;font-size:.8rem
}
.task-h .mono{font-family:var(--mono);color:var(--dim);font-size:.72rem}
.task-h .typ{color:var(--isaac)}
.task-h .desc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-prog{height:4px;background:rgba(107,115,133,.2)}
.task-prog>i{display:block;height:100%;background:var(--isaac)}
.task-d{display:none;padding:12px;border-top:1px solid var(--line)}
.task.exp .task-d{display:block}
.trace{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto}
.trace-step{
  padding:8px 10px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  border-left:3px solid var(--line);background:rgba(0,0,0,.25);font-size:.78rem
}
.trace-step.classification,.trace-step.governance,.trace-step.strategy,.trace-step.motivation{border-left-color:var(--rot)}
.trace-step.retrieval,.trace-step.learning{border-left-color:var(--blau)}
.trace-step.execution,.trace-step.evaluation,.trace-step.selection,.trace-step.eligibility,.trace-step.context_integration{border-left-color:var(--gruen)}
.trace-meta{font-family:var(--mono);font-size:.68rem;color:var(--dim);margin-top:4px;word-break:break-all}
.tlog{max-height:160px;overflow-y:auto;font-family:var(--mono);font-size:.72rem;background:var(--bg-0);border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}
/* Tools map */
.cap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.cap{
  padding:10px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--bg-0);font-size:.8rem
}
.cap .nm{font-weight:600;margin-bottom:4px}
.cap .meta{color:var(--muted);font-size:.72rem;font-family:var(--mono)}
.cap.on{border-color:rgba(62,207,142,.35)}
.cap.off{opacity:.55}
.sec-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:14px 0 8px}
/* Providers */
.prov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.prov{padding:12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg-0)}
.prov.primary{outline:1px solid color-mix(in srgb, var(--isaac) 45%, transparent)}
/* Log */
.log-row{display:grid;grid-template-columns:64px 100px 1fr;gap:8px;font-size:.75rem;padding:6px 0;border-bottom:1px solid rgba(46,52,68,.4);font-family:var(--mono)}
.log-row .ts{color:var(--dim)}
/* Neural bars */
.nbar{display:grid;grid-template-columns:90px 1fr 40px;gap:8px;align-items:center;margin-bottom:6px;font-size:.78rem}
.nbar .trk{height:8px;background:rgba(107,115,133,.2);border-radius:99px;overflow:hidden}
.nbar .trk>i{display:block;height:100%;background:linear-gradient(90deg,var(--blau),var(--isaac))}
.empty{color:var(--dim);font-size:.85rem;padding:20px;text-align:center}
/* Mobile */
@media(max-width:960px){
  body.dash{overflow:auto;height:auto;min-height:100dvh}
  .shell{height:auto}
  .body{grid-template-columns:1fr;grid-template-rows:auto minmax(280px,50vh) minmax(320px,50vh)}
  body.focus .body{grid-template-columns:1fr}
  body.focus .stage-wrap{display:none}
  .nav{flex-direction:row;flex-wrap:wrap;max-height:none;overflow:visible}
  .nav button{flex-direction:row;gap:6px;padding:8px 10px;font-size:.72rem}
  .task-h{grid-template-columns:50px 60px 1fr 50px;font-size:.72rem}
  .task-h .hide-m{display:none}
}
@media(prefers-reduced-motion:reduce){.phase.active .phase-node,.dot.boot,.dot.err{animation:none}}
</style>
</head>
<body class="dash cockpit">
<div class="shell">
  <header class="header">
    <div class="brand">
      <div id="conn-dot" class="dot boot"></div>
      <div>
        <h1>Isaac</h1>
        <small id="brand-sub">Cognitive Cockpit · v6</small>
      </div>
    </div>
    <div class="mode-tog" role="group" aria-label="Ansicht">
      <button type="button" id="mode-focus" onclick="setMode('focus')">Focus</button>
      <button type="button" id="mode-cockpit" class="active" onclick="setMode('cockpit')">Cockpit</button>
    </div>
    <div class="theme-tog" role="group" aria-label="Farbschema" id="theme-tog">
      <button type="button" data-theme="plasma" onclick="setTheme('plasma')">Cyan</button>
      <button type="button" data-theme="violet" onclick="setTheme('violet')">Violet</button>
      <button type="button" data-theme="ember" onclick="setTheme('ember')">Ember</button>
      <button type="button" data-theme="contrast" onclick="setTheme('contrast')">Contrast</button>
    </div>
    <span class="chip" id="sys-chip">…</span>
    <span class="chip hot" id="prov-chip" title="Primary provider">–</span>
    <div class="h-actions">
      <button type="button" class="btn" onclick="sendCmd('status')">Status</button>
      <button type="button" class="btn danger" id="pause-btn" onclick="togglePause()">Pause</button>
      <span class="clock" id="clock">--:--:--</span>
    </div>
  </header>

  <section class="now" id="now" aria-label="NOW Stream">
    <div class="now-top">
      <div>
        <div class="now-head" id="now-head">Verbinde…</div>
        <div class="now-sub" id="now-sub">—</div>
      </div>
      <button type="button" class="btn" onclick="toggleNow()" aria-label="NOW ein/aus">▾</button>
    </div>
    <div class="now-phases" id="now-phases"></div>
  </section>

  <div class="kpi-focus" id="kpi-focus"></div>

  <div class="body">
    <nav class="nav scroll-y" id="nav" aria-label="Hauptnavigation"></nav>
    <div class="stage-wrap min0">
      <div class="stage-bar">
        <h2 id="stage-title">Überblick</h2>
        <span class="chip" id="stage-meta">Live</span>
      </div>
      <main class="stage scroll-y" id="stage" tabindex="0"></main>
    </div>
    <aside class="chat-wrap min0">
      <div class="chat-bar">
        <h2>Chat</h2>
        <button type="button" class="btn" onclick="clearChat()">Leeren</button>
      </div>
      <div class="msgs scroll-y" id="msgs" aria-live="polite"></div>
      <div class="composer">
        <div class="quick">
          <button type="button" onclick="quick('Hallo Isaac')">Hallo</button>
          <button type="button" onclick="quick('status:pipeline')">Pipeline</button>
          <button type="button" onclick="quick('ziele')">Ziele</button>
          <button type="button" onclick="quick('status:smoke')">Smoke</button>
        </div>
        <textarea id="chat-in" rows="3" placeholder="Nachricht an Isaac…" aria-label="Chat-Eingabe"></textarea>
        <div class="composer-row">
          <button type="button" class="btn primary" id="send-btn" onclick="sendChat()">Senden</button>
          <span class="chip" id="ws-label">WS …</span>
        </div>
      </div>
    </aside>
  </div>
</div>
<script>
/* ═══ Isaac Dashboard v6 — Cognitive Cockpit ═══
   Owner override: full dashboard redesign (AGENTS non-touch except explicit request).
   Scroll contract: shell 100dvh; stage + msgs + nav use .scroll-y + min-height:0.
*/
const PHASES = [
  {id:'input',label:'Eingabe',layer:'rot'},
  {id:'classification',label:'Klassif.',layer:'rot'},
  {id:'retrieval',label:'Retrieval',layer:'blau'},
  {id:'strategy',label:'Strategy',layer:'rot'},
  {id:'task',label:'Task',layer:'gruen'},
  {id:'execution',label:'Execute',layer:'gruen'},
  {id:'evaluation',label:'Eval',layer:'gruen'},
  {id:'memory',label:'Memory',layer:'blau'},
];
const NAV = [
  {id:'overview',label:'Überblick',ico:'◉'},
  {id:'tasks',label:'Tasks',ico:'▣'},
  {id:'memory',label:'Gedächtnis',ico:'◈'},
  {id:'tools',label:'Werkzeuge',ico:'⚒'},
  {id:'goals',label:'Ziele',ico:'◎'},
  {id:'providers',label:'Provider',ico:'⚙'},
  {id:'governance',label:'Verfassung',ico:'⚖'},
  {id:'neural',label:'Neural',ico:'⌬'},
  {id:'ops',label:'Ops',ico:'⬡'},
  {id:'audit',label:'Audit',ico:'☰'},
];

const S = {
  mode: localStorage.getItem('isaac.dash.mode') || 'cockpit',
  theme: localStorage.getItem('isaac.dash.theme') || 'plasma',
  nav: localStorage.getItem('isaac.dash.nav') || 'overview',
  online: false,
  paused: false,
  ws: null,
  state: {},
  now: {},
  tasks: {},
  audit: [],
  tools: [],
  taskFilter: 'all',
  logFilter: 'all',
  reconnectMs: 1200,
  _raf: 0,
  _nearBottom: true,
};

function esc(s){
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function $(id){return document.getElementById(id)}
function nowClock(){
  const d=new Date();
  $('clock').textContent=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(nowClock,1000); nowClock();


function setTheme(name){
  const allowed=['plasma','violet','ember','contrast'];
  if(!allowed.includes(name)) name='plasma';
  S.theme=name;
  localStorage.setItem('isaac.dash.theme', name);
  document.documentElement.setAttribute('data-theme', name);
  document.querySelectorAll('#theme-tog button').forEach(b=>{
    b.classList.toggle('active', b.dataset.theme===name);
  });
}

function setMode(m){
  S.mode=m; localStorage.setItem('isaac.dash.mode',m);
  document.body.classList.toggle('focus', m==='focus');
  document.body.classList.toggle('cockpit', m==='cockpit');
  $('mode-focus').classList.toggle('active', m==='focus');
  $('mode-cockpit').classList.toggle('active', m==='cockpit');
  renderKpiFocus();
}
function setNav(id){
  S.nav=id; localStorage.setItem('isaac.dash.nav',id);
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active', b.dataset.nav===id));
  const n=NAV.find(x=>x.id===id);
  $('stage-title').textContent=n?n.label:id;
  scheduleRender();
}
function toggleNow(){
  const p=$('now-phases');
  p.style.display=p.style.display==='none'?'flex':'none';
}

function buildNav(){
  $('nav').innerHTML=NAV.map(n=>
    `<button type="button" data-nav="${n.id}" class="${S.nav===n.id?'active':''}" onclick="setNav('${n.id}')">
      <span class="ico" aria-hidden="true">${n.ico}</span>${esc(n.label)}
    </button>`
  ).join('');
}

function renderNow(){
  const n=S.now||{};
  $('now-head').textContent=n.headline||'Isaac wartet…';
  $('now-sub').textContent=n.subline||(S.online?'Live':'Offline');
  const ph=n.phases||{};
  const active=n.pipeline_phase||'idle';
  $('now-phases').innerHTML=PHASES.map(p=>{
    const st=(ph[p.id]&&ph[p.id].status)||(active===p.id?'active':active==='idle'?'idle':'idle');
    let cls=st;
    if(active!=='idle' && st==='idle'){
      const order=PHASES.map(x=>x.id);
      if(order.indexOf(p.id)<order.indexOf(active)) cls='done';
    }
    if(active===p.id) cls='active';
    return `<div class="phase ${cls} layer-${p.layer}" title="${esc(p.label)}">
      <div class="phase-node"></div>
      <div class="phase-label">${esc(p.label)}</div>
    </div>`;
  }).join('');
  $('brand-sub').textContent=n.headline?String(n.headline).slice(0,48):'Cognitive Cockpit · v6';
}

function kpi(label,val,cls){
  return `<div class="kpi"><div class="k">${esc(label)}</div><div class="v ${cls||''}">${val}</div></div>`;
}
function renderKpiFocus(){
  if(S.mode!=='focus') return;
  const ex=S.state.executor||{};
  const g=S.state.goals||{};
  $('kpi-focus').innerHTML=[
    kpi('Running', ex.running??ex.running_count??0, 'y'),
    kpi('Queue', ex.queued??ex.queue??0),
    kpi('Ziele', g.count??(g.active||[]).length??0, 'c'),
    kpi('Score', ex.avg_score!=null?Number(ex.avg_score).toFixed(1):'–', 'g'),
  ].join('');
}

function scheduleRender(){
  if(S._raf) return;
  S._raf=requestAnimationFrame(()=>{ S._raf=0; renderStage(); renderNow(); renderKpiFocus(); });
}

function renderStage(){
  const el=$('stage');
  const fn={
    overview: renderOverview,
    tasks: renderTasks,
    memory: renderMemory,
    tools: renderTools,
    goals: renderGoals,
    providers: renderProviders,
    governance: renderGovernance,
    neural: renderNeural,
    ops: renderOps,
    audit: renderAudit,
  }[S.nav]||renderOverview;
  el.innerHTML=fn();
}

function renderTasks(){
  const list=Object.values(S.tasks).sort((a,b)=>(b.erstellt||'').localeCompare(a.erstellt||''));
  const f=S.taskFilter;
  const filtered=list.filter(t=>{
    const st=String(t.status||'').toLowerCase();
    if(f==='all') return true;
    if(f==='running') return ['running','evaluating','followup'].includes(st);
    return st===f;
  }).slice(0,100);
  const filters=['all','running','done','failed','queued','evaluating'];
  return `
    <div class="filters">${filters.map(x=>
      `<button type="button" class="${f===x?'active':''}" onclick="S.taskFilter='${x}';scheduleRender()">${x}</button>`
    ).join('')}</div>
    ${filtered.length?filtered.map(taskRow).join(''):'<div class="empty">Keine Tasks</div>'}`;
}
function taskRow(t){
  const st=String(t.status||'queued').toLowerCase();
  const prog=Math.min(100,Math.round((Number(t.progress)||0)*100));
  const score=t.score!=null?Number(t.score).toFixed(1):(t.score_detail&&t.score_detail.gesamt!=null?Number(t.score_detail.gesamt).toFixed(1):'–');
  const trace=Array.isArray(t.decision_trace)?t.decision_trace:[];
  const traceHtml=trace.length?`<div class="trace">${trace.map((e,i)=>{
    const phase=String(e.phase||'unknown').toLowerCase();
    const data=e.data?esc(JSON.stringify(e.data).slice(0,240)):'';
    return `<div class="trace-step ${esc(phase)}"><strong>${i+1}. ${esc(phase)} · ${esc(e.event||'–')}</strong>
      ${data?`<div class="trace-meta">${data}</div>`:''}</div>`;
  }).join('')}</div>`:'<div class="empty" style="padding:8px">Kein DecisionTrace</div>';
  const log=(t.log||[]).slice(-30).map(e=>`<div><span style="color:var(--dim)">${esc(e.ts||'')}</span> ${esc(e.msg||'')}</div>`).join('');
  return `<div class="task ${esc(st)}" id="task-${esc(t.id)}">
    <div class="task-h" onclick="this.parentElement.classList.toggle('exp')">
      <span class="mono">${esc(String(t.id||'').slice(0,8))}</span>
      <span class="typ">${esc(t.typ||t.type||'—')}</span>
      <span class="desc">${esc(t.beschreibung||t.prompt||'—')}</span>
      <span class="mono hide-m">${esc(st)}</span>
      <span class="mono hide-m">${esc(score)}</span>
      <span class="mono">${prog}%</span>
    </div>
    <div class="task-prog"><i style="width:${prog}%"></i></div>
    <div class="task-d">
      <div class="sec-title">Antwort</div>
      <div style="font-size:.84rem;margin-bottom:10px">${esc(t.antwort_kurz||t.fehler||'—')}</div>
      <div class="sec-title">Causal Timeline · DecisionTrace (${trace.length})</div>
      ${traceHtml}
      <div class="sec-title">Live-Log</div>
      <div class="tlog">${log||'—'}</div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button type="button" class="btn danger" onclick="cancelTask('${esc(t.id)}')">Abbrechen</button>
        <button type="button" class="btn" onclick="resumeTask('${esc(t.id)}')">Resume</button>
      </div>
    </div>
  </div>`;
}

/* ═══ Chat ═══ */
function addMsg(who, text){
  const box=$('msgs');
  const d=document.createElement('div');
  d.className='msg '+who;
  const label=who==='steffen'?'Steffen':who==='isaac'?'Isaac':'System';
  d.innerHTML=`<div class="who">${label}</div><div class="body"></div>`;
  d.querySelector('.body').textContent=text;
  box.appendChild(d);
  if(S._nearBottom) box.scrollTop=box.scrollHeight;
}
function clearChat(){ $('msgs').innerHTML=''; addMsg('sys','Chat geleert'); }
$('msgs').addEventListener('scroll',()=>{
  const el=$('msgs');
  S._nearBottom=(el.scrollHeight-el.scrollTop-el.clientHeight)<80;
});

function sendChat(){
  const t=$('chat-in').value.trim();
  if(!t) return;
  addMsg('steffen', t);
  $('chat-in').value='';
  send({typ:'chat', text:t});
}
function quick(t){ $('chat-in').value=t; sendChat(); }
$('chat-in').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); }
});

/* ═══ WS ═══ */
function setOnline(on){
  S.online=on;
  const d=$('conn-dot');
  d.className='dot '+(on?'on':'err');
  $('sys-chip').textContent=on?(S.paused?'PAUSIERT':'ONLINE'):'OFFLINE';
  $('ws-label').textContent=on?'WS open':'WS …';
}
function send(obj){
  if(S.ws && S.ws.readyState===1) S.ws.send(JSON.stringify(obj));
  else addMsg('sys','Nicht verbunden');
}
function sendCmd(c){ send({typ:'command', text:c}); }
function togglePause(){
  if(S.paused){ send({typ:'resume'}); } else { send({typ:'pause'}); }
}
function cancelTask(id){ send({typ:'cancel_task', task_id:id}); }
function resumeTask(id){
  fetch('/api/tasks/resume',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:id})})
    .then(r=>r.json()).then(j=>addMsg('sys','Resume: '+(j.ok?'ok':j.error||'fail'))).catch(e=>addMsg('sys',String(e)));
}
function addDir(){
  const t=$('dir-in').value.trim(); if(!t) return;
  send({typ:'set_directive', text:t, priority:10});
  $('dir-in').value='';
}
function revokeDir(id){ send({typ:'revoke_directive', id:id}); }

function handle(msg){
  switch(msg.typ){
    case 'init':
    case 'state':
      applyState(msg.state||{});
      break;
    case 'now':
      S.now=msg.now||msg; renderNow(); break;
    case 'tasks':
      (msg.tasks||[]).forEach(t=>{ if(t&&t.id) S.tasks[t.id]=t; });
      if(S.nav==='tasks') scheduleRender();
      break;
    case 'task_update':
      if(msg.task&&msg.task.id){ S.tasks[msg.task.id]=msg.task; if(S.nav==='tasks') scheduleRender(); }
      break;
    case 'audit':
      (msg.entries||[]).forEach(e=>S.audit.push(e));
      if(S.audit.length>500) S.audit=S.audit.slice(-500);
      if(S.nav==='audit') scheduleRender();
      break;
    case 'audit_event':
      if(msg.entry){ S.audit.push(msg.entry); if(S.nav==='audit') scheduleRender(); }
      break;
    case 'chat_response':
      addMsg('isaac', msg.text||'');
      break;
    case 'directives':
      if(S.state) S.state.directives=msg.directives||[];
      if(S.nav==='memory') scheduleRender();
      break;
    case 'providers':
      if(S.state) S.state.providers=msg.providers||[];
      if(S.nav==='providers') scheduleRender();
      break;
    case 'system':
      S.paused=msg.event==='paused';
      $('pause-btn').textContent=S.paused?'Weiter':'Pause';
      setOnline(S.online);
      break;
    case 'fehler':
      addMsg('sys', 'Fehler: '+(msg.msg||''));
      break;
    case 'ok':
      addMsg('sys', msg.msg||'ok');
      break;
    default: break;
  }
}

function applyState(st){
  if(!st||typeof st!=='object') return;
  S.state=st;
  S.now=st.now||S.now||{};
  S.paused=!!st.paused;
  if(st.tools) S.tools=st.tools;
  $('pause-btn').textContent=S.paused?'Weiter':'Pause';
  const p=(st.settings&&st.settings.active_provider)||(S.now&&S.now.provider)||'–';
  $('prov-chip').textContent=p;
  setOnline(S.online);
  scheduleRender();
}

async function connect(){
  const proto=location.protocol==='https:'?'wss:':'ws:';
  const urls=[
    proto+'//'+location.host+'/ws',
    proto+'//'+location.hostname+':8765/ws',
    proto+'//'+location.hostname+':8767/ws',
  ];
  for(const url of urls){
    try{
      const ws=new WebSocket(url);
      const ok=await new Promise(res=>{
        const t=setTimeout(()=>res(false),4000);
        ws.addEventListener('open',()=>{clearTimeout(t);res(true)},{once:true});
        ws.addEventListener('error',()=>{clearTimeout(t);res(false)},{once:true});
      });
      if(!ok){ try{ws.close()}catch(_){ } continue; }
      S.ws=ws;
      ws.onmessage=e=>{ try{ handle(JSON.parse(e.data)); }catch(err){ console.error(err);} };
      ws.onclose=()=>{ setOnline(false); addMsg('sys','WS getrennt — reconnect…'); setTimeout(connect, S.reconnectMs); };
      ws.onerror=()=>{ try{ws.close()}catch(_){ } };
      setOnline(true);
      addMsg('sys','Verbunden: '+url);
      $('ws-label').textContent='WS open';
      return;
    }catch(e){ console.error(e); }
  }
  setOnline(false);
  addMsg('sys','WS fehlgeschlagen');
  setTimeout(connect, 3000);
}

/* boot */
buildNav();
setMode(S.mode);
setTheme(S.theme);
setNav(S.nav);
PHASES.forEach(()=>{}); // warm
renderNow();
connect();
</script>
